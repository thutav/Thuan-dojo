name: Testes e build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Base geográfica reproduzível
        run: npm run build:geo

      - name: Pipeline de coleta sobre as fixtures (sem rede)
        run: npm run ingest -- --fixtures

      - name: Build do aplicativo
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificação da interface no navegador
        run: npm run verify:ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: verification/
          retention-days: 7
