name: Coleta de imóveis de Ilhabela

# A coleta roda aqui, e não na máquina de quem desenvolve, porque o runner do GitHub tem
# internet aberta e Chromium instalado. O resultado é commitado em data/ e o GitHub Pages
# passa a servir o dataset novo para o aplicativo em /ilhabela.
on:
  schedule:
    # A cada 6 horas (UTC).
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      somente:
        description: 'Coletar apenas destas fontes (ids separados por vírgula)'
        required: false
        type: string

concurrency:
  group: coleta-ilhabela
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        run: npm test

      - name: Coletar anúncios
        id: coleta
        run: |
          npm run ingest -- ${{ inputs.somente && format('--somente={0}', inputs.somente) || '' }} \
            2>&1 | tee coleta.log
        continue-on-error: true

      - name: Publicar o log da coleta no resumo
        if: always()
        run: |
          {
            echo '## Coleta de imóveis'
            echo '```'
            tail -n 60 coleta.log 2>/dev/null || echo 'sem log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruir o aplicativo
        if: steps.coleta.outcome == 'success'
        run: npm run build

      - name: Commitar o dataset e o build
        if: steps.coleta.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data ilhabela
          if git diff --cached --quiet; then
            echo 'Nada mudou desde a última coleta.'
            exit 0
          fi
          total=$(node -e "console.log(require('./data/listings.json').imoveis.length)")
          git commit -m "Coleta automática: ${total} imóveis em Ilhabela"
          git push

      - name: Falhar se a coleta não trouxe nada
        if: steps.coleta.outcome != 'success'
        run: |
          echo 'A coleta não produziu dados. O dataset anterior foi preservado.'
          echo 'Veja o log acima para saber qual fonte falhou.'
          exit 1
