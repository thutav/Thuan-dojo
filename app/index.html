<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F0E" />
    <meta
      name="description"
      content="Imóveis de Ilhabela em um lugar só: venda, aluguel anual e temporada, com mapa de preço por metro quadrado, filtros e comparação entre anúncios."
    />
    <title>Ilhabela Imóveis — mapa de preço por m²</title>
    <link rel="icon" href="./icone.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      A folha de estilo do Google bloqueia a renderização: enquanto ela não chega, a tela fica
      em branco. Num 3G fraco — a fila da balsa, a estrada de Castelhanos — isso são segundos
      de nada. Carregada como "print", o navegador não espera por ela; quando ela chega, o
      onload promove para "all" e a tipografia entra por cima. O <noscript> cobre quem
      desligou o JavaScript, e o fallback de sistema segura o texto no intervalo.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Este aplicativo precisa de JavaScript para desenhar o mapa e cruzar os anúncios.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
